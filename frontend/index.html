<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Escrow DApp</title>
  <style>
    :root { --primary: #4f46e5; --primary-hover: #4338ca; --bg: #f8fafc; --card-bg: #fff; --border: #e2e8f0; }
    body { font-family: 'Inter', system-ui, sans-serif; max-width: 860px; margin: 0 auto; padding: 24px; background: var(--bg); color: #1e293b; line-height: 1.6; }
    h1 { font-size: 1.9rem; margin-bottom: 4px; }
    h3 { margin-top: 0; color: #334155; }
    input, button { margin: 4px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); font-size: 14px; }
    input:focus { outline: 2px solid var(--primary); border-color: transparent; }
    button { cursor: pointer; background: var(--primary); color: #fff; border: none; font-weight: 600; transition: background .15s; }
    button:hover { background: var(--primary-hover); }
    button:disabled { opacity: .6; cursor: not-allowed; }
    .card { border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin: 16px 0; background: var(--card-bg); box-shadow: 0 1px 3px rgba(0,0,0,.06); }
    .status-badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
    .pending { background: #fef3c7; color: #92400e; }
    .funded { background: #dbeafe; color: #1e40af; }
    .completed { background: #dcfce7; color: #166534; }
    .disputed { background: #fee2e2; color: #991b1b; }
    .refunded { background: #e2e8f0; color: #475569; }
    #toast { position: fixed; bottom: 16px; right: 16px; padding: 12px 18px; border-radius: 8px; font-size: 14px; display: none; max-width: 360px; z-index: 999; }
    #toast.success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
    #toast.error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
    .small { font-size: 13px; color: #64748b; }
  </style>
</head>
<body>
  <div class="header-bar">
    <h1>Decentralized Escrow</h1>
    <button onclick="init()">🔌 Connect Wallet</button>
  </div>
  <p class="small">Network: <span id="network">-</span> | Account: <span id="account">-</span> | Contract: <span id="contractAddr">-</span></p>
  <div id="toast"></div>

  <div class="card">
    <h3>Create Escrow</h3>
    <input id="seller" placeholder="Seller address" size="42" />
    <input id="arbiter" placeholder="Arbiter address" size="42" />
    <input id="token" placeholder="Token address (0x0 for ETH)" value="0x0000000000000000000000000000000000000000" size="42" />
    <input id="amount" type="number" placeholder="Amount" />
    <input id="expiration" type="number" placeholder="Expiration (unix ts)" />
    <input id="feePercent" type="number" placeholder="Fee % (0 = default)" value="0" />
    <button onclick="createEscrow()">Create Escrow</button>
  </div>

  <div class="card">
    <h3>Deposit</h3>
    <input id="depositId" type="number" placeholder="Escrow ID" />
    <button onclick="deposit()">Deposit ETH</button>
  </div>

  <div class="card">
    <h3>Actions</h3>
    <input id="actionId" type="number" placeholder="Escrow ID" />
    <button onclick="confirmBuyer()">Confirm (Buyer)</button>
    <button onclick="confirmSeller()">Confirm (Seller)</button>
    <button onclick="releaseFunds()">Release</button>
    <button onclick="openDispute()">Open Dispute</button>
    <button onclick="resolveDisputeSeller()">Resolve → Seller</button>
    <button onclick="resolveDisputeBuyer()">Resolve → Refund</button>
    <button onclick="requestRefund()">Request Refund</button>
  </div>

  <div class="card">
    <h3>Query Escrow</h3>
    <input id="queryId" type="number" placeholder="Escrow ID" />
    <button onclick="queryEscrow()">Query</button>
    <pre id="escrowInfo"></pre>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/ethers@6/dist/ethers.min.js"></script>
  <script src="./DecentralizedEscrowABI.json"></script>
  <script>
    const CONTRACT_ADDRESS = "YOUR_DEPLOYED_ADDRESS";
    let signer, contract;

    function showToast(msg, type="success") {
      const t=document.getElementById("toast");
      t.textContent=msg; t.className=type; t.style.display="block";
      setTimeout(()=> t.style.display="none", 4000);
    }

    function handleError(e) {
      const msg = e?.reason || e?.message || String(e);
      showToast(msg, "error");
      console.error(e);
    }

    async function init() {
      try {
        if (!window.ethereum) return showToast("Install MetaMask", "error");
        const provider = new ethers.BrowserProvider(window.ethereum);
        signer = await provider.getSigner();
        // load ABI safely
        const abiData = typeof abi !== 'undefined' ? abi : [];
        contract = new ethers.Contract(CONTRACT_ADDRESS, abiData, signer);
        document.getElementById("account").textContent = await signer.getAddress();
        document.getElementById("network").textContent = (await provider.getNetwork()).name;
        document.getElementById("contractAddr").textContent = CONTRACT_ADDRESS.slice(0,10)+"...";
        if (CONTRACT_ADDRESS === "YOUR_DEPLOYED_ADDRESS") showToast("Set CONTRACT_ADDRESS to deployed address", "error");
        else showToast("Wallet connected");
      } catch(e){ handleError(e); }
    }

    init();

    async function createEscrow() {
      try {
      const seller = document.getElementById("seller").value;
      const arbiter = document.getElementById("arbiter").value;
      const token = document.getElementById("token").value;
      const amount = ethers.parseEther(document.getElementById("amount").value);
      const expiration = parseInt(document.getElementById("expiration").value);
      const feePercent = parseInt(document.getElementById("feePercent").value);
      const tx = await contract.createEscrow(seller, arbiter, token, amount, expiration, feePercent);
      await tx.wait();
      showToast("Escrow created! Tx: " + tx.hash.slice(0,10)+"...");
      } catch(e){ handleError(e); }
    }

    async function deposit() {
      const id = document.getElementById("depositId").value;
      const escrow = await contract.escrows(id);
      const tx = await contract.deposit(id, { value: escrow.amount });
      await tx.wait();
      showToast("Deposited! Tx: " + tx.hash.slice(0,10)+"...");
    }

    async function confirmBuyer() {
      const id = document.getElementById("actionId").value;
      const tx = await contract.confirmByBuyer(id);
      await tx.wait();
      showToast("Confirmed by buyer");
    }

    async function confirmSeller() {
      const id = document.getElementById("actionId").value;
      const tx = await contract.confirmBySeller(id);
      await tx.wait();
      showToast("Confirmed by seller");
    }

    async function releaseFunds() {
      const id = document.getElementById("actionId").value;
      const tx = await contract.release(id);
      await tx.wait();
      showToast("Released ✅");
    }

    async function openDispute() {
      const id = document.getElementById("actionId").value;
      const tx = await contract.openDispute(id);
      await tx.wait();
      showToast("Dispute opened");
    }

    async function resolveDisputeSeller() {
      const id = document.getElementById("actionId").value;
      const tx = await contract.resolveDispute(id, 2);
      await tx.wait();
      showToast("Resolved → Seller");
    }

    async function resolveDisputeBuyer() {
      const id = document.getElementById("actionId").value;
      const tx = await contract.resolveDispute(id, 4);
      await tx.wait();
      showToast("Resolved → Refund");
    }

    async function requestRefund() {
      const id = document.getElementById("actionId").value;
      const tx = await contract.requestRefund(id);
      await tx.wait();
      showToast("Refunded ✅");
    }

    async function queryEscrow() {
      const id = document.getElementById("queryId").value;
      const e = await contract.escrows(id);
      const statusMap = ["Pending", "Funded", "Completed", "Disputed", "Refunded"];
      document.getElementById("escrowInfo").textContent = JSON.stringify({
        buyer: e.buyer,
        seller: e.seller,
        arbiter: e.arbiter,
        token: e.token,
        amount: ethers.formatEther(e.amount),
        status: statusMap[Number(e.status)],
        buyerConfirmed: e.buyerConfirmed,
        sellerConfirmed: e.sellerConfirmed,
        expiration: new Date(Number(e.expiration) * 1000).toLocaleString(),
      }, null, 2);
    }
  </script>
</body>
</html>
